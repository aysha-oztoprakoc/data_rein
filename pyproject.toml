[project]
name = "data_rein"
version = "0.2.0"
description = "Universal AI harness: shared wiki, model-agnostic router, and task trail for a fleet of local-first coding agents (PON architecture)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=50.0.0",
    "EbookLib>=0.18",
    "striprtf>=0.0.26",
    "rank-bm25>=0.2.2",
    "pytest-mock>=3.15.1",
    "playwright>=1.61.0",
    "markdownify>=1.2.3",
    "ddgs>=9.14.4",
    "textual>=8.2.8",
    "mcp>=1.28.1",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "websockets>=16.0",
    "pydantic>=2.13.0",
    "defusedxml>=0.7.1",
    # Event-driven file watching for the PON wiki watcher (reins.services.wiki_watcher).
    "watchdog>=4.0.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest-mock>=3.12.0"
]
# Heavy (~8.8GB incl. opencv/modelscope/huggingface-hub) layout-aware PDF
# extraction. MinerUPDFExtractor uses it as the default PDF path when
# installed, degrading gracefully to PyMuPDF/pdftotext when it's not - so
# this is opt-in rather than a base dependency every `uv sync` pulls in.
ingestion = [
    "mineru>=3.4.0"
]
# Local speech-to-text for audio and video knowledge extraction.
media = [
    "faster-whisper>=1.2.1"
]
# QLoRA fine-tuning (reins.training). Heavy GPU stack, opt-in only - the
# harness core never imports torch; capability.probe() degrades gracefully
# when this extra isn't installed or the hardware can't support it.
train = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "datasets>=2.20.0",
    "bitsandbytes>=0.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/reins"
]

# A pip package should ship only code and packaging metadata, not the harness's
# local data/knowledge trees. Without this the sdist ballooned to ~290MB by
# vendoring third_party/, knowledge_base/ PDFs, ComfyUI and per-node data dirs.
[tool.hatch.build.targets.sdist]
include = [
    "src/**",
    "tests/**",
    "scripts/**",
    "pyproject.toml",
    "uv.lock",
    "README.md",
    "LICENSE",
    "AGENTS.md",
    "CLAUDE.md",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    ".venv",
    "third_party",
    "knowledge_base",
    "tulpas",
    "data-oby",
    "ComfyUI",
    "data_harness",
    "data",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.6",
    "basedpyright>=1.39.9",
    "detect-secrets>=1.5.0",
    "mcp-compressor>=0.4.2",
    "pip-audit>=2.9.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "ruff>=0.12.0",
    "types-psutil>=7.2.2.20260518",
]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/*.py"]
extend-exclude = ["scripts/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
reins = "reins.cli:main"

[tool.basedpyright]
include = [
    "src",
    "tests",
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "third_party",
    "skills",
    "tulpas",
    "config",
    "scripts",
    "data-oby",
    "ComfyUI",
    "wiki_vault",
    "DATA",
    "nix-cache",
    "scratch",
    "logs",
    "native",
]
extraPaths = ["typings"]
stubPath = "typings"
