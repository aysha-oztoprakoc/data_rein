[project]
name = "data_rein"
version = "0.1.0"
description = "Universal AI harness: shared wiki, model-agnostic router, and task trail for a fleet of local-first coding agents (PON architecture)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "EbookLib>=0.18",
    "striprtf>=0.0.26",
    "rank-bm25>=0.2.2",
    "pytest-mock>=3.15.1",
    "playwright>=1.61.0",
    "markdownify>=1.2.3",
    "duckduckgo-search>=8.1.1",
    "textual>=8.2.8",
    "mcp>=1.28.1",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-mock>=3.12.0"
]
# Heavy (~8.8GB incl. opencv/modelscope/huggingface-hub) layout-aware PDF
# extraction. MinerUPDFExtractor uses it as the default PDF path when
# installed, degrading gracefully to PyMuPDF/pdftotext when it's not - so
# this is opt-in rather than a base dependency every `uv sync` pulls in.
ingestion = [
    "mineru>=3.4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/reins"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "mcp-compressor>=0.4.2",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
reins = "reins.cli:main"

[tool.bandit]
# B404: import subprocess
# B603: subprocess call without shell=True
# B110: try/except pass
# B108: hardcoded /tmp directory
# B311: pseudo-random generators
# B607: partial path (ping, ssh)
# B310: urllib
# B104: bind all interfaces (Hermes API)
# B405, B314: xml.etree.ElementTree (Safe for our extraction pipeline which runs in an isolated container anyway)
skips = ["B404", "B603", "B110", "B108", "B311", "B607", "B310", "B104", "B405", "B314"]
