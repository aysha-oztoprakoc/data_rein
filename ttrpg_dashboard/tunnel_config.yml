# tunnel_config.yml
# Configuração Zero Trust para o TTRPG Dashboard
# Requer Autenticação cloudflared login prévia.

url: http://localhost:8080
tunnel: ttrpg-dashboard-tunnel
credentials-file: ~/.cloudflared/credentials.json

# Integração PON: Logs e métricas do túnel podem ser monitoradas localmente
# para disparar avisos de queda de rede no nó Amdy.
metrics: localhost:2000

ingress:
  - hostname: dashboard.jamaisvucain.com
    service: http://localhost:8080
  # Graceful Degradation: Se o serviço falhar, lança erro HTTP direto
  - service: http_status:404
